<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="I build games, web apps and tools">
<style>@font-face{font-family:T;font-style:italic;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:B;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@keyframes w{0%{opacity:0;transform:translateY(14px)}4.0%{opacity:1;transform:translateY(0)}29.3%{opacity:1;transform:translateY(0)}33.3%,100%{opacity:0;transform:translateY(-14px)}}
.s{font:italic 800 30px T;fill:#8a8f98;letter-spacing:2px}
.w{font:italic 800 30px T;fill:#ff6a00;letter-spacing:2px;opacity:0;animation:w 7.5s ease-in-out infinite}
