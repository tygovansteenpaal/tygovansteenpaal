"260" r="1.5" fill="#ffa31a" style="--dx:-11px;animation:rise 6.9s linear -5.5s infinite"/><circle cx="683" cy="260" r="2.2" fill="#d42a00" style="--dx:-27px;animation:rise 7.3s linear -6.1s infinite"/><circle cx="402" cy="260" r="2.0" fill="#ffa31a" style="--dx:-19px;animation:rise 6.7s linear -3.6s infinite"/><circle cx="443" cy="260" r="1.4" fill="#ff6a00" style="--dx:4px;animation:rise 7.2s linear -0.9s infinite"/><circle cx="931" cy="260" r="2.4" fill="#ffa31a" style="--dx:-7px;animation:rise 4.8s linear -1.9s infinite"/><circle cx="937" cy="260" r="2.4" fill="#d42a00" style="--dx:-1px;animation:rise 6.6s linear -1.0s infinite"/><circle cx="481" cy="260" r="1.8" fill="#d42a00" style="--dx:14px;animation:rise 5.1s linear -6.7s infinite"/><circle cx="816" cy="260" r="1.5" fill="#ffa31a" style="--dx:2px;animation:rise 4.6s linear -8.6s infinite"/><circle cx="682" cy="260" r="3.0" fill="#ff6a00" style="--dx:9px;animation:rise 7.9s linear -2.7s infinite"/><circle cx="688" cy="260" r="1.7" fill="#ffa31a" style="--dx:16px;animation:rise 6.2s linear -1.5s infinite"/><circle cx="631" cy="260" r="2.4" fill="#ffa31a" style="--dx:-18px;animation:rise 8.0s linear -6.8s infinite"/><circle cx="806" cy="260" r="2.7" fill="#ff6a00" style="--dx:-9px;animation:rise 5.5s linear -4.7s infinite"/><circle cx="970" cy="260" r="2.8" fill="#ffa31a" style="--dx:6px;animation:rise 6.6s linear -1.7s infinite"/><circle cx="449" cy="260" r="3.1" fill="#ffa31a" style="--dx:-8px;animation:rise 8.9s linear -8.6s infinite"/><circle cx="118" cy="260" r="2.1" fill="#ff6a00" style="--dx:29px;animation:rise 6.0s linear -4.3s infinite"/><circle cx="480" cy="260" r="2.5" fill="#d42a00" style="--dx:10px;animation:rise 8.1s linear -0.8s infinite"/>
<text class="name" x="500" y="128" text-anchor="middle" fill="url(#chrome)" stroke="#000" stroke-opacity=".35" stroke-width="1">TYGO VAN STEENPAAL</text>
<g clip-path="url(#txt)"><g transform="skewX(-20)"><rect class="sheen" x="0" y="40" width="160" height="110" fill="url(#sh)"/></g></g>
<text class="sub" x="500" y="172" text-anchor="middle">Full-stack developer from the Netherlands</text>
<rect x="0" y="245" width="1000" height="5" fill="url(#bar)"/>
</g>
<rect x=".5" y=".5" width="999" height="249" rx="18" fill="none" stroke="#2a2a30"/>
</svg>