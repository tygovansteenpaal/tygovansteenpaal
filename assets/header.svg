<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Tygo van Steenpaal, full-stack developer from the Netherlands">
<style>@font-face{font-family:T;font-style:italic;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:B;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-280px);opacity:0}}
@keyframes sheen{0%{transform:translateX(-700px)}55%,100%{transform:translateX(1100px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
circle{transform-box:fill-box}
.name{font:italic 800 76px T;letter-spacing:2px}
.sub{font:500 21px B;fill:#9da1aa;letter-spacing:.5px}
.glow{animation:glow 3.2s ease-in-out infinite}
.flame{transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
.sheen{animation:sheen 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c8ccd2"/><stop offset=".55" stop-color="#7c818b"/><stop offset="1" stop-color="#e6e8ec"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="fire" cx=".5" cy="1" r=".75"><stop offset="0" stop-color="#ff6a00" stop-opacity="1"/><stop offset=".4" stop-color="#d42a00" stop-opacity=".42"/><stop offset="1" stop-color="#d42a00" stop-opacity="0"/></radialGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#d42a00"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffa31a"/></linearGradient>
<clipPath id="txt"><text class="name" x="500" y="128" text-anchor="middle">TYGO VAN STEENPAAL</text></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="250" fill="#111114"/>
<g class="flame"><ellipse class="glow" cx="500" cy="290" rx="600" ry="190" fill="url(#fire)"/></g>
