</style>
<text class="s" x="500" y="43" text-anchor="end">I BUILD</text><text class="w" x="514" y="43" style="animation-delay:0.0s">GAMES</text><text class="w" x="514" y="43" style="animation-delay:2.5s">WEB APPS</text><text class="w" x="514" y="43" style="animation-delay:5.0s">TOOLS</text>
