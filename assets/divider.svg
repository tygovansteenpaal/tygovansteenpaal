<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10">
<style>@keyframes run{from{transform:translateX(-500px)}to{transform:translateX(0)}}.r{animation:run 3.5s linear infinite}@media (prefers-reduced-motion:reduce){.r{animation:none}}</style>
